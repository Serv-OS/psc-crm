<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Get a price</title>
<!--
  Always-open sales chat — for a landing page, a QR code at a show stand, or a
  tablet in the office. Open it with the embed's site key:

    /sales-chat.html?key=SITE_KEY

  Optional: &title=Your%20heading
-->
<style>
  html, body { height: 100%; margin: 0; background: #f4f1ec; }
  #chat { position: fixed; inset: 0; }
  .setup { font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           color: #221a14; max-width: 480px; margin: 12vh auto; padding: 24px; text-align: center; }
  .setup code { background: #fff; padding: 2px 6px; border-radius: 6px; border: 1px solid #e2dcd4; }
</style>
</head>
<body>
  <div id="chat"></div>
  <script>
    var key = new URLSearchParams(location.search).get('key');
    if (!key) {
      document.getElementById('chat').innerHTML =
        '<div class="setup"><h2>Sales chat</h2>' +
        '<p>This page needs a site key.</p>' +
        '<p>Open it as <code>/sales-chat.html?key=YOUR_SITE_KEY</code></p>' +
        '<p>Create the key in the CRM under Settings &rarr; Sales chat.</p></div>';
    } else {
      var s = document.createElement('script');
      s.src = 'chat.js';
      s.setAttribute('data-site-key', key);
      s.setAttribute('data-mode', 'inline');
      s.setAttribute('data-target', '#chat');
      s.setAttribute('data-title', new URLSearchParams(location.search).get('title') || 'Get a price');
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
